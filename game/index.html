<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wokfire Alley: Night-Market Cooking Rush</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1033; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #test-result { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Wokfire Alley: take orders, chop ingredients, cook them in the wok, plate the dish and serve it before the timer runs out"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<pre id="test-result"></pre>
<script type="module" src="./src/main.js"></script>
</body>
</html>
